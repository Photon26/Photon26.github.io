<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GelSight Physics Simulator</title>
<style>
  :root {
    --ink: #1f2a37; --text: #3d4651; --muted: #66717d; --rule: #e3e7ec; --soft: #f5f7f9; --accent: #2a5785;
    --warn: #b4530f; --warn-bg: #fdf3e7; --ok: #2f7d4f; --lit: #5b4a99;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html { background: #fff; color: var(--text); font: 14px/1.5 var(--font); -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: #fff; }
  button, input, select { font: inherit; color: inherit; }
  h1, h2, h3 { color: var(--ink); margin: 0; }
  .top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding: 12px 18px; border-bottom: 1px solid var(--rule); }
  .top h1 { font-size: 17px; font-weight: 700; margin-right: auto; }
  .top h1 small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 8px; }
  .top h1 .back { display: block; margin-bottom: 2px; font-size: 12px; font-weight: 400; color: var(--accent); text-decoration: none; }
  .top h1 .back:hover { text-decoration: underline; }
  #lang button { font-size: 12px; padding: 3px 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 3px 10px; border: 1px solid var(--rule); border-radius: 999px; background: #fff; cursor: pointer; font-size: 12.5px; color: var(--muted); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.preset { border-style: dashed; }
  .chip:disabled { opacity: 0.45; cursor: not-allowed; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding: 16px 18px 40px; max-width: 1500px; margin: 0 auto; }
  @media (min-width: 1100px) { .layout { grid-template-columns: minmax(520px, 680px) minmax(0, 1fr); align-items: start; } .viewer { position: sticky; top: 12px; } }

  /* viewer */
  .tabs { display: flex; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: var(--soft); margin-bottom: 8px; }
  .tab { flex: 1 1 0; padding: 6px 4px; border: 0; border-left: 1px solid var(--rule); background: transparent; cursor: pointer; font-size: 13px; color: var(--muted); }
  .tab:first-child { border-left: 0; }
  .tab[aria-selected="true"] { background: #fff; color: var(--accent); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
  .canvas-wrap { position: relative; aspect-ratio: 4 / 3; border: 1px solid var(--rule); border-radius: 6px; overflow: hidden; background: #222; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  .hud { position: absolute; left: 8px; top: 8px; padding: 2px 8px; border-radius: 4px; background: rgba(20,24,29,0.6); color: #fff; font-size: 11.5px; pointer-events: none; font-family: var(--mono); }
  .busy { position: absolute; right: 8px; top: 8px; padding: 2px 8px; border-radius: 4px; background: rgba(20,24,29,0.6); color: #ffd28a; font-size: 11.5px; pointer-events: none; display: none; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-top: 8px; font-size: 13px; }
  .row .grow { flex: 1 1 auto; }
  .btn { padding: 4px 10px; border: 1px solid #c9d1d9; border-radius: 5px; background: #fff; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: #224a72; color: #fff; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 5px; overflow: hidden; }
  .seg button { padding: 3px 9px; border: 0; border-left: 1px solid var(--rule); background: #fff; cursor: pointer; font-size: 12.5px; color: var(--muted); }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .shapes { display: flex; flex-wrap: wrap; gap: 5px; }
  .shape { padding: 4px 10px; border: 1px solid var(--rule); border-radius: 5px; background: #fff; cursor: pointer; font-size: 13px; }
  .shape[aria-checked="true"] { border-color: var(--accent); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: #f1f5f9; }
  .kv { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; margin-top: 10px; }
  .kv label { font-size: 13px; color: var(--text); white-space: nowrap; }
  .kv input[type=range] { width: 100%; accent-color: var(--accent); }
  .kv output { font-family: var(--mono); font-size: 12.5px; min-width: 6.5em; text-align: right; color: var(--ink); }
  .readouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-top: 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--soft); }
  .readouts div { padding: 5px 9px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .readouts dt { font-size: 11px; color: var(--muted); }
  .readouts dd { margin: 0; font-family: var(--mono); font-size: 13px; color: var(--ink); white-space: nowrap; }
  .legend { margin-top: 6px; font-size: 12px; color: var(--muted); min-height: 1.5em; }

  /* panel */
  .panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .factor { border: 1px solid var(--rule); border-radius: 8px; background: #fff; }
  .factor > header { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--rule); background: var(--soft); border-radius: 8px 8px 0 0; }
  .factor > header h2 { font-size: 14.5px; flex: 1 1 auto; }
  .factor > header h2 small { font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
  .factor.off > header { background: #fafafa; }
  .factor.off .body { opacity: 0.55; }
  .factor .body { padding: 6px 12px 12px; }
  .switch { position: relative; width: 34px; height: 19px; flex: none; }
  .switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: #c8ced5; transition: background 0.15s; }
  .switch span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 15px; height: 15px; border-radius: 50%; background: #fff; transition: transform 0.15s; box-shadow: 0 1px 2px rgba(0,0,0,0.25); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(15px); }
  .switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  details.note { margin: 8px 0 4px; border-left: 3px solid var(--rule); padding: 0 0 0 10px; }
  details.note summary { cursor: pointer; font-size: 12.5px; color: var(--accent); }
  details.note div { font-size: 12.5px; line-height: 1.65; color: var(--text); padding: 4px 0 2px; }
  details.note p { margin: 0 0 6px; }
  details.note ul { margin: 0 0 6px; padding-left: 1.2em; }
  .prow { display: grid; grid-template-columns: minmax(150px, 1.1fr) minmax(80px, 1fr) 74px 40px; align-items: center; gap: 4px 8px; padding: 3px 0; border-bottom: 1px dashed #eef1f4; }
  .prow:last-child { border-bottom: 0; }
  .prow.bool { grid-template-columns: auto minmax(0, 1fr); }
  .prow .lbl { font-size: 13px; display: flex; align-items: center; gap: 5px; min-width: 0; }
  .prow input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  .prow input[type=number] { width: 100%; padding: 1px 4px; border: 1px solid #d3d9df; border-radius: 4px; font-family: var(--mono); font-size: 12.5px; text-align: right; }
  .prow .unit { font-size: 12px; color: var(--muted); }
  .prow select { padding: 2px 4px; border: 1px solid #d3d9df; border-radius: 4px; font-size: 12.5px; grid-column: 2 / -1; }
  .prow input[type=checkbox] { accent-color: var(--accent); width: 15px; height: 15px; margin: 0; }
  .sub { padding-left: 14px; }
  .flag { flex: none; font-size: 10.5px; line-height: 1; padding: 2px 4px; border-radius: 3px; cursor: help; }
  .flag.guess { background: var(--warn-bg); color: var(--warn); }
  .flag.repo { background: #e8f4ec; color: var(--ok); }
  .flag.lit { background: #efecf8; color: var(--lit); }
  .flags-legend { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  table.leds { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
  table.leds th { font-weight: 600; color: var(--muted); text-align: left; padding: 3px 3px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  table.leds td { padding: 2px 3px; border-bottom: 1px dashed #eef1f4; }
  table.leds input[type=number] { width: 4.4em; padding: 1px 3px; border: 1px solid #d3d9df; border-radius: 3px; font-family: var(--mono); font-size: 12px; text-align: right; }
  table.leds select { font-size: 12px; padding: 1px 2px; }
  .led-scroll { overflow-x: auto; }
  table.mix { border-collapse: collapse; font-family: var(--mono); font-size: 12px; margin-top: 6px; }
  table.mix th, table.mix td { padding: 2px 8px; border: 1px solid var(--rule); text-align: right; }
  table.mix th { font-family: var(--font); font-weight: 600; color: var(--muted); background: var(--soft); }
  .placeholder { padding: 10px 12px; font-size: 13px; color: var(--muted); }
  .exp .body { display: grid; gap: 8px; }
  .exp fieldset { border: 1px solid var(--rule); border-radius: 6px; padding: 6px 10px 10px; margin: 0; }
  .exp legend { font-size: 13px; font-weight: 600; color: var(--ink); padding: 0 4px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 14px; align-items: center; font-size: 13px; }
  .grid2 label { display: flex; align-items: center; gap: 6px; }
  .grid2 input[type=number], .grid2 input[type=text] { width: 5.5em; padding: 1px 4px; border: 1px solid #d3d9df; border-radius: 4px; font-family: var(--mono); font-size: 12.5px; }
  .grid2 input[type=text].wide { width: 12em; }
  progress { width: 100%; height: 10px; accent-color: var(--accent); }
  .msg { font-size: 12.5px; color: var(--muted); }
  .msg.err { color: #b3261e; }
  kbd { font-family: var(--mono); font-size: 11.5px; padding: 0 4px; border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 3px; background: #fff; }
</style>
</head>
<body>
<header class="top">
  <h1><a class="back" id="back" href="/demo/" data-zh="← 交互演示" data-en="← Interactive demo">← Interactive demo</a><span data-zh="GelSight 类视触觉传感器 · 物理仿真" data-en="GelSight-type tactile sensor · physics simulator">GelSight-type tactile sensor · physics simulator</span><small data-zh="纯颜色（无 marker）· 透明硅胶 + 反光涂层 + 侧面多色 LED" data-en="colour only (no markers) · clear silicone + reflective coating + side-lit multicolour LEDs">colour only (no markers) · clear silicone + reflective coating + side-lit multicolour LEDs</small></h1>
  <div class="chips" id="chips"></div>
  <span class="seg" id="lang" role="group" aria-label="Language / 语言"><button data-lang="en" aria-pressed="true">EN</button><button data-lang="zh" aria-pressed="false" lang="zh-CN">中文</button></span>
</header>
<main class="layout">
  <section class="viewer" aria-label="Simulation view">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-view="cam" data-zh="相机图像" data-en="Camera image">Camera image</button>
      <button class="tab" role="tab" aria-selected="false" data-view="diff" data-zh="差分" data-en="Difference">Difference</button>
      <button class="tab" role="tab" aria-selected="false" data-view="height" data-zh="高度" data-en="Height">Height</button>
      <button class="tab" role="tab" aria-selected="false" data-view="normal" data-zh="法向" data-en="Normals">Normals</button>
      <button class="tab" role="tab" aria-selected="false" data-view="pressure" data-zh="压力" data-en="Pressure">Pressure</button>
    </div>
    <div class="canvas-wrap" id="wrap">
      <canvas id="view" tabindex="0" aria-label="Sensor surface: press to indent, drag to move, scroll to rotate"></canvas>
      <div class="hud" id="hud"></div>
      <div class="busy" id="busy" data-zh="求解中…" data-en="Solving…">Solving…</div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="row">
      <span data-zh="对比 A/B：" data-en="Compare A/B:">Compare A/B:</span>
      <button class="btn" id="snapA" data-zh="当前存为 A" data-en="Store current as A">Store current as A</button>
      <span class="seg" id="abmode"><button data-ab="off" aria-pressed="true" data-zh="关" data-en="Off">Off</button><button data-ab="split" aria-pressed="false" data-zh="A｜当前" data-en="A | current">A | current</button><button data-ab="diff" aria-pressed="false" data-zh="|当前−A|×4" data-en="|current − A| × 4">|current − A| × 4</button></span>
      <input type="range" id="split" min="0" max="1" step="0.01" value="0.5" class="grow" aria-label="Split position" disabled>
      <span class="msg" id="aInfo" data-zh="未存 A" data-en="No A stored">No A stored</span>
    </div>
    <div class="row">
      <span data-zh="压头：" data-en="Indenter:">Indenter:</span>
      <span class="shapes" id="shapes" role="radiogroup">
        <button class="shape" role="radio" aria-checked="true" data-shape="sphere" data-zh="球" data-en="Sphere">Sphere</button>
        <button class="shape" role="radio" aria-checked="false" data-shape="cylinder" data-zh="圆柱(横放)" data-en="Cylinder (lying)">Cylinder (lying)</button>
        <button class="shape" role="radio" aria-checked="false" data-shape="cube" data-zh="方块" data-en="Cube">Cube</button>
        <button class="shape" role="radio" aria-checked="false" data-shape="screw" data-zh="螺丝头" data-en="Screw head">Screw head</button>
        <button class="shape" role="radio" aria-checked="false" data-shape="letter" data-zh="字母" data-en="Letters">Letters</button>
      </span>
      <input type="text" id="letter" value="R" maxlength="3" size="4" aria-label="Letters" style="width:4em;padding:2px 6px;border:1px solid #d3d9df;border-radius:4px" hidden>
    </div>
    <div class="kv" id="indKV"></div>
    <div class="row">
      <label><input type="checkbox" id="hold" checked> <span data-zh="松开后保持按压" data-en="Keep pressed after release">Keep pressed after release</span></label>
      <button class="btn" id="lift" data-zh="抬起 &lt;kbd&gt;Esc&lt;/kbd&gt;" data-en="Lift &lt;kbd&gt;Esc&lt;/kbd&gt;">Lift <kbd>Esc</kbd></button>
      <span class="msg" data-zh="按下＝压入，拖动＝移动，滚轮 / &lt;kbd&gt;Q&lt;/kbd&gt;&lt;kbd&gt;E&lt;/kbd&gt;＝旋转" data-en="Press = indent, drag = move, scroll / &lt;kbd&gt;Q&lt;/kbd&gt;&lt;kbd&gt;E&lt;/kbd&gt; = rotate">Press = indent, drag = move, scroll / <kbd>Q</kbd><kbd>E</kbd> = rotate</span>
    </div>
    <dl class="readouts" id="ro"></dl>
  </section>

  <aside class="panel" id="panel">
    <div class="flags-legend" data-zh="参数来源：&lt;span class=&quot;flag repo&quot;&gt;仓库&lt;/span&gt; 取自作者的 Gelsight_controller 仓库 &lt;span class=&quot;flag lit&quot;&gt;文献&lt;/span&gt; 典型文献 / 手册值 &lt;span class=&quot;flag guess&quot;&gt;⚠ 待确认&lt;/span&gt; 合理默认值，请换成实测值" data-en="Parameter sources: &lt;span class=&quot;flag repo&quot;&gt;repo&lt;/span&gt; from the author's Gelsight_controller repository &lt;span class=&quot;flag lit&quot;&gt;lit&lt;/span&gt; typical literature / datasheet value &lt;span class=&quot;flag guess&quot;&gt;⚠ assumed&lt;/span&gt; reasonable default, replace with measured values"></div>
  </aside>
</main>
<script>
/* =====================================================================
   GelSight-type tactile sensor simulator - physics core (no DOM).
   Units: mm, MPa (= N/mm^2), N, s.  Frame: x right, y down (image rows),
   z points from the coating toward the camera.  Surface height u(x,y) is
   the coating displacement toward the camera (indentation > 0).
   ===================================================================== */
var GS = (function () {
  'use strict';

  /* ---------------- small utilities ---------------- */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function sstep(e0, e1, x) { var t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function gaussianRng(seed) {
    var r = mulberry32(seed >>> 0), spare = 0, has = false;
    return function () {
      if (has) { has = false; return spare; }
      var u = r() || 1e-12, v = r(), m = Math.sqrt(-2 * Math.log(u));
      spare = m * Math.sin(6.283185307179586 * v); has = true;
      return m * Math.cos(6.283185307179586 * v);
    };
  }
  var BIG = 1e6;
  var NORM = (function () { var g = gaussianRng(12345), t = new Float32Array(1 << 16); for (var i = 0; i < t.length; i++) t[i] = g(); return t; })();

  /* ---------------- radix-2 complex FFT (2-D, square) ---------------- */
  function FFT2(n) {
    var levels = Math.round(Math.log(n) / Math.LN2);
    if ((1 << levels) !== n) throw new Error('FFT size must be a power of two');
    var rev = new Uint32Array(n), cs = new Float64Array(n >> 1), sn = new Float64Array(n >> 1), i;
    for (i = 0; i < n; i++) { var r = 0; for (var b = 0; b < levels; b++) r |= ((i >> b) & 1) << (levels - 1 - b); rev[i] = r; }
    for (i = 0; i < (n >> 1); i++) { cs[i] = Math.cos(2 * Math.PI * i / n); sn[i] = Math.sin(2 * Math.PI * i / n); }
    function fft1(re, im, off, stride, inv) {
      var i, j, a, b, t;
      for (i = 0; i < n; i++) {
        j = rev[i];
        if (j > i) { a = off + i * stride; b = off + j * stride; t = re[a]; re[a] = re[b]; re[b] = t; t = im[a]; im[a] = im[b]; im[b] = t; }
      }
      var sgn = inv ? 1 : -1;
      for (var size = 2; size <= n; size <<= 1) {
        var half = size >> 1, step = n / size;
        for (i = 0; i < n; i += size) {
          for (var jj = 0, k = 0; jj < half; jj++, k += step) {
            a = off + (i + jj) * stride; b = a + half * stride;
            var wr = cs[k], wi = sgn * sn[k];
            var xr = re[b] * wr - im[b] * wi, xi = re[b] * wi + im[b] * wr;
            re[b] = re[a] - xr; im[b] = im[a] - xi; re[a] += xr; im[a] += xi;
          }
        }
      }
    }
    this.n = n;
    this.run = function (re, im, inv) {          // unscaled in both directions
      var r;
      for (r = 0; r < n; r++) fft1(re, im, r * n, 1, inv);
      for (r = 0; r < n; r++) fft1(re, im, r, n, inv);
    };
  }

  /* ---------------- separable blurs (edge-extended) ---------------- */
  function gaussKernel(sigma) {
    var r = Math.max(1, Math.ceil(3 * sigma)), k = new Float32Array(2 * r + 1), s = 0;
    for (var i = -r; i <= r; i++) { k[i + r] = Math.exp(-i * i / (2 * sigma * sigma)); s += k[i + r]; }
    for (i = 0; i < k.length; i++) k[i] /= s;
    return k;
  }
  function convRows(src, dst, w, h, k) {
    var r = (k.length - 1) >> 1;
    for (var y = 0; y < h; y++) {
      var o = y * w;
      for (var x = 0; x < w; x++) {
        var acc = 0;
        for (var q = -r; q <= r; q++) { var xx = x + q; xx = xx < 0 ? 0 : (xx >= w ? w - 1 : xx); acc += k[q + r] * src[o + xx]; }
        dst[o + x] = acc;
      }
    }
  }
  function convCols(src, dst, w, h, k) {
    var r = (k.length - 1) >> 1;
    for (var y = 0; y < h; y++) {
      for (var x = 0; x < w; x++) {
        var acc = 0;
        for (var q = -r; q <= r; q++) { var yy = y + q; yy = yy < 0 ? 0 : (yy >= h ? h - 1 : yy); acc += k[q + r] * src[yy * w + x]; }
        dst[y * w + x] = acc;
      }
    }
  }
  function boxPass(src, dst, w, h, r, horiz) {
    var inv = 1 / (2 * r + 1), x, y, acc, i;
    if (horiz) {
      for (y = 0; y < h; y++) {
        var o = y * w; acc = 0;
        for (i = -r - 1; i < r; i++) acc += src[o + (i < 0 ? 0 : (i >= w ? w - 1 : i))];
        for (x = 0; x < w; x++) {
          var a = x + r, b = x - r - 1;
          acc += src[o + (a >= w ? w - 1 : a)] - src[o + (b < 0 ? 0 : b)];
          dst[o + x] = acc * inv;
        }
      }
    } else {
      for (x = 0; x < w; x++) {
        acc = 0;
        for (i = -r - 1; i < r; i++) acc += src[(i < 0 ? 0 : (i >= h ? h - 1 : i)) * w + x];

    f1: '<p><b>模型</b>：涂层内表面（相机一侧）BRDF = 朗伯漫反射 ρd/π ＋ 微面元镜面 ks·D·V（GGX/Trowbridge–Reitz 法线分布，高度相关 Smith 遮蔽–阴影项，粗糙度 α）。</p>' +

    f4: '<p><b>模型</b>（在胶体表面网格上，叠加到直射辐亮度上）：</p><ul>' +
      '<li><b>吸收 / 体散射</b>：LED 到表面的光按 Beer–Lambert e^(−μt·r) 衰减；被散射的部分当作各向同性"雾光"，每颗 LED 加 (ρd/π)·h·Es，并在约 2 mm 内平滑（不产生阴影，降低对比）。成像杂散光：图像 = (1−g)·I + g·模糊(I, σ)。</li>' +

    f6: '<p><b>模型</b>：拖动时，接触区下面的胶随压头一起切向位移（粘着），位移场 u_t(x) = w(x)·(D + φ×(x − c))，w 在粘着区内为 1（刚性平移），区外在约一个胶厚的距离上衰减。表面随之平移；对粘在底板上的不可压缩薄层，按厚度平均的连续性方程，表面再抬起或下沉 Δu = (t/2)·∇·u_t：压头前方堆起、后方下陷。</p>' +

  var NOTES_EN = {
    sensor: '<p>Coordinates: x right, y down (image columns and rows), z from the coating toward the camera. Height u is the coating displacement toward the camera: positive where pressed in, negative where the gel bulges. Simulation resolution 320×240 (export also 640×480).</p>',
    f1: '<p><b>Model.</b> BRDF of the inner (camera-side) coating surface = Lambertian diffuse ρd/π + microfacet specular ks·D·V (GGX/Trowbridge–Reitz distribution, height-correlated Smith masking–shadowing, roughness α).</p>' +
      '<p><b>Shadowing.</b> ① Attached shadow: zero where n·l ≤ 0. ② Microscale masking: the Smith term. ③ Cast shadows: a horizon sweep through the height field from the deformation centroid toward each source, with a soft penumbra set by the size of the emitter.</p>' +
      '<p><b>Simplifications.</b> ks does not vary with angle (no Fresnel term); no subsurface scattering in the coating and no anisotropy from flake orientation; one shadow direction per point source (small error near the deformation); for strip sources the specular term uses the energy-weighted mean direction; occlusion of the camera view by steep walls is ignored (near-normal viewing).</p>' +
      '<p><b>When off.</b> Pure Lambertian, no cast shadows (n·l clamping only).</p>',
    f2: '<p><b>Model.</b> The gel is a linear elastic layer (thickness t, E, ν) bonded to rigid acrylic, with frictionless contact on top. The surface normal compliance uses the closed-form thin-layer solution in Fourier space:</p>' +
      '<p style="font-family:var(--mono);font-size:12px">C(k) = 2(1−ν²)/(E·k) · (κ·sinh2η − 2η) / (κ·cosh2η + 2η² + (1+κ²)/2), η = k·t, κ = 3 − 4ν</p>' +
      '<p>Contact is solved on an FFT grid with the Polonsky–Keer conjugate-gradient method (p ≥ 0, gap ≥ 0, complementarity), so the transition zone at the contact edge and the surrounding sink-in and bulge (volume-conserving as ν→0.5) come out of the solution rather than being imposed.</p>' +
      '<ul><li><b>Coating</b>: a thin plate with bending stiffness D = Ec·tc³/12(1−ν²) is added to the compliance (1/C + D·k⁴); on the fine grid the same cut-off wavenumber is applied as a Gaussian low-pass, so the coating smooths away fine detail.</li>' +
      '<li><b>Detail</b>: the displacement from the solver grid (0.3 mm) is upsampled with cubic B-splines and combined with the indenter shape on the fine grid by a max (the gel cannot pass through the indenter); grooves narrower than the grid are bridged rather than filled.</li>' +
      '<li><b>Hyperelastic (optional)</b>: neo-Hookean compression stiffening S(λ) = (λ − λ⁻²)/(3(λ − 1)), λ = 1 − u/t, <b>applied to the force only</b>. Under depth control the surface shape is still the linear solution. This is the biggest simplification here; true large-deformation shapes need FEM. Under force control it changes the depth and therefore, indirectly, the image.</li>' +
      '<li><b>Viscoelastic (optional)</b>: standard linear solid with creep compliance J(t) = J₀[1 + r(1 − e^(−t/τ))]; the delayed and instantaneous parts share the same spatial kernel. Held at constant depth, the force relaxes to 1/(1+r); after release the imprint fades with time constant τ (hysteresis).</li></ul>' +
      '<p><b>Validation.</b> The thick-layer limit matches Hertz (same peak pressure, contact radius within 2–4%); for ν = 0.5 the thin-layer force is within 1% of the asymptote F = (2π/3)·E·R²·δ³/t³ at a/t ≈ 40; viscoelastic relaxation settles at exactly 1/(1+r).</p>' +
      '<p><b>Simplifications.</b> Periodic boundaries (38.4 mm window, much larger than the gel thickness; edge error &lt; 0.1%); frictionless (shear is factor ⑥); the coating low-pass approximates the prescribed-displacement case.</p>' +
      '<p><b>When off.</b> The surface is the indenter shape itself (max(0, penetration)), with no transition zone and no force.</p>',
    f3: '<p><b>Model.</b> Each LED is a point source at its effective position as seen from inside the gel; with a strip width &gt; 0 it is split into 3 sub-sources along the edge (light guide or LED strip). Irradiance = Φ·cos^m(ψ)/r²·(n·l), with m from the half-power angle. Φ is normalised so that the flat-surface irradiance at the centre of the field of view equals the set intensity, so switching the falloff on or off does not change the brightness at the centre.</p>' +
      '<p><b>Spectral crosstalk.</b> LED spectra are Gaussians (white = 450 nm blue die + broad 565 nm phosphor); the camera R/G/B quantum efficiencies are Gaussian approximations of a typical Bayer CMOS sensor with a 655 nm IR-cut filter. Integrating gives the mixing matrix below, each column normalised to that LED\'s strongest channel. The coating reflectance is taken as spectrally flat (neutral grey or silver).</p>' +
      '<p><b>Simplifications.</b> Light paths inside the light guide are not traced (effective positions instead); all LEDs are identical; the camera QE is not a measured curve.</p>' +

    f4: '<p><b>Model</b> (on the gel-surface grid, added to the direct radiance):</p><ul>' +
      '<li><b>Absorption and bulk scattering</b>: light travelling from the LEDs to the surface is attenuated as e^(−μt·r) (Beer–Lambert). The scattered part is treated as an isotropic haze: each LED adds (ρd/π)·h·Es, smoothed over about 2 mm (no shadows, lower contrast). Veiling glare in imaging: image = (1−g)·I + g·blur(I, σ).</li>' +
      '<li><b>Coating interreflection</b>: one-bounce approximation. A point surrounded by coating that is closer to the camera (a concavity) receives light reflected by its neighbours: L += ρd·k·cav·blur_R(L), cav = clamp((blur_R(u) − u)/R, 0, 1).</li>' +
      '<li><b>Light trapping by total internal reflection</b>: the fraction 1 − 1/n² ≈ 50% of the coating\'s diffuse light that leaves outside the gel\'s escape cone (sinθ &gt; 1/n) is totally reflected at the acrylic/air face and returns to the coating about 2T·tanθ away (T = gel + acrylic thickness). The feedback per bounce is g = ρd(1 − 1/n²)(1 − loss), the multi-bounce gain is g/(1−g), and the light is spread with two Gaussians of σ = 1.5T and 4T. This is the main reason real images have a pale, desaturated background.</li>' +
      '<li><b>Refraction</b>: ① Camera rays bend at air → acrylic → gel (Snell\'s law). For the same indentation the parallax is smaller than without refraction, the viewing direction used for specular reflection changes, and the Fresnel transmission of oblique rays falls with field angle (needs ⑤ perspective). ② When an LED sits inside the light guide (height &lt; gel + acrylic thickness), total reflection at the acrylic bottom face is represented by a mirror-image source (Fresnel reflectance below the critical angle), which adds a set of steeper sources.</li></ul>' +
      '<p><b>Simplifications.</b> Interreflection is single-bounce, with the visible solid angle approximated by concavity; the trapping kernel is shift-invariant, and the real side-wall geometry near the edges is folded into the per-bounce loss; bending of LED light at the gel/acrylic interface is ignored (the indices differ by only 0.08); refraction at the entry face is not modelled for LEDs outside the acrylic, so read their positions as effective positions seen from inside the gel.</p>',
    f5: '<ul><li><b>Perspective parallax</b>: pinhole camera at distance Zc below the coating. Lens distortion is assumed to be calibrated out, so on the reference plane (undeformed coating) pixels map one-to-one to millimetres; points pushed toward the camera move along the line of sight toward the optical axis: x_seen = x − tanθ_gel(r)·u. The ray/height-field intersection is solved per pixel, so the exported ground truth is the surface point each pixel actually sees.</li>' +
      '<li><b>Defocus</b>: thin lens with object-side blur diameter b = A·|z − z_f|/z, A = f/N, using the refraction-shortened apparent depth u/n. It is approximated by a Gaussian of σ = b/4 plus a base lens PSF; spatially varying blur interpolates between several blur levels.</li>' +
      '<li><b>Vignetting</b>: cosⁿ of the field angle × (1 − k·r²); n = 4 for a rectilinear lens (cos⁴ law), about 1–2 for a fisheye.</li>' +
      '<li><b>Noise</b>: the signal is converted to electrons via the full-well capacity, with shot noise (Gaussian approximation of Poisson) and read noise, then quantised to 8 bits. The seed changes every frame; batch export records it in the metadata.</li>' +
      '<li><b>Gamma</b>: v^(1/γ).</li>' +
      '<li><b>Exposure and white balance</b>: by default the exposure is calibrated on the no-contact background (99th percentile = 0.85) and then locked, as on a real sensor; manual EV and continuous auto-exposure are also available. White balance: grey world (locked on the background) or manual. Order: optics → exposure → noise → white balance → gamma → quantisation.</li></ul>' +
      '<p><b>Simplifications.</b> No Bayer demosaicing or colour-correction matrix; no hot pixels, fixed-pattern noise, motion blur or rolling shutter; defocus uses a Gaussian rather than a disc and ignores occlusion at edges.</p>' +
      '<p><b>When off.</b> Ideal linear camera, orthographic projection, exposure locked on the no-contact background.</p>',
    f6: '<p><b>Model.</b> While dragging, the gel under the contact moves tangentially with the indenter (stick). The displacement field is u_t(x) = w(x)·(D + φ×(x − c)), with w = 1 in the stick zone (rigid translation), decaying over about one gel thickness outside. The surface is shifted accordingly, and for an incompressible layer bonded to its base, depth-averaged continuity raises or lowers it by Δu = (t/2)·∇·u_t: material piles up ahead of the indenter and sinks behind it.</p>' +
      '<p><b>Stick–slip.</b> Tangential stiffness K_t = G·A_eff/t (G = E/2(1+ν)), torsional stiffness K_r = G·∫w·r²/t. Once |D| exceeds μF/K_t (or the twist exceeds μF·r_eff/K_r), the indenter slides over the gel and the stick displacement stays at the limit.</p>' +
      '<p><b>Simplifications.</b> Tangential and normal contact are decoupled (normal contact is solved in material coordinates, then shifted); no partial micro-slip (Cattaneo–Mindlin annulus); tangential compliance from uniform shear. This is a small-strain linear model, reliable for |D| ≲ 0.3·t; beyond that it overestimates the pile-up, so the stick displacement is also capped at 0.5·t (beyond that it counts as sliding). On a colour-only sensor the visible effect is mainly a slight drag and a front/back asymmetry of the imprint.</p><p><b>When off.</b> Dragging just moves the indenter and solves the contact again.</p>'

      var key = e.id || ('shape:' + e.value);
      v[key] = e.type === 'checkbox' ? e.checked : e.value;
    });
    return v;
  }
  function restoreForm(v) {
    Array.prototype.forEach.call(document.querySelectorAll('.exp input, .exp select'), function (e) {
      var key = e.id || ('shape:' + e.value);
      if (!(key in v)) return;
      if (e.type === 'checkbox') e.checked = v[key]; else e.value = v[key];
    });
  }
  function setLang(l) {
    if (l === LANG || batch.running) return;
    LANG = l;
    try { localStorage.setItem('gs-lang', l); } catch (e) { /* ignore */ }
    var form = saveForm();
    applyStatic(); rebuildPanel(); restoreForm(form);
    drawDirty = true; draw(); lastRO = 0; readouts();
  }
  Array.prototype.forEach.call(document.querySelectorAll('#lang button'), function (b) { b.addEventListener('click', function () { setLang(b.dataset.lang); }); });

  /* ---------- start ---------- */
  applyStatic();
  buildChips(); buildPanel(); buildIndenterKV(); lastCtl = P.f2.on + P.f2.control + P.indenter.shape;
  refreshers.forEach(function (f) { f(); });
  st.holding = true;
  window.__gs = { P: function () { return P; }, sim: sim, bg: bgSim, st: st, request: request, onParam: onParam, setView: function (v) { var b = document.querySelector('.tab[data-view="' + v + '"]'); if (b) b.click(); },
    exportFrame: exportFrame, snapA: function () { $('#snapA').click(); }, setAB: setAB, refresh: function () { refreshers.forEach(function (f) { f(); }); },
    setLang: setLang, lang: function () { return LANG; } };
  request();
})();

</script>
</body>
</html>
